name: Hourly Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: read # Default: read-only; jobs that must write will override at job-level.
  actions: read # To cancel the job if there's ongoing one.

env:
  GIT_AUTHOR_NAME: actions-user
  GIT_AUTHOR_EMAIL: action@github.com
  GIT_COMMITTER_NAME: actions-user
  GIT_COMMITTER_EMAIL: action@github.com

jobs:
  check:
    name: Check for updates in Lobe Chat
    runs-on: ubuntu-latest
    outputs:
      new_commit: ${{ steps.check-updates.outputs.new_commit }}
      fetched_commit: ${{ steps.check-updates.outputs.fetched_commit }}
      last_commit: ${{ steps.check-updates.outputs.last_commit }}

    steps:
      - name: Fail if an older run is already active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # github.workflow_ref looks like:
          # owner/repo/.github/workflows/file.yml@refs/heads/main
          WORKFLOW_FILE="$(basename "${WORKFLOW_REF%@*}")"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=100" \
            > runs.json
          OLDER_ACTIVE_COUNT="$(
            jq --arg run_id "$RUN_ID" --argjson run_number "$RUN_NUMBER" '
              [.workflow_runs[]
               | select((.id | tostring) != $run_id)
               | select(.run_number < $run_number)
               | select(
                   .status == "in_progress" or
                   .status == "queued" or
                   .status == "waiting" or
                   .status == "pending" or
                   .status == "requested"
                 )]
              | length
            ' runs.json
          )"
          if [ "$OLDER_ACTIVE_COUNT" -gt 0 ]; then
            echo "An older run of this workflow is already active or waiting. Cancel it first."
            exit 1
          fi
      - name: Check out patch repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Clone and check out `lobehub/lobe-chat`
        run: |
          set -euo pipefail
          cd ../
          git clone https://github.com/lobehub/lobe-chat.git -b main --depth 5
          cd ./lobe-chat
      - name: Check latest (main branch) commit hash of Lobe Chat
        id: check-updates
        working-directory: ../lobe-chat
        run: |
          set -euo pipefail
          FETCHED_COMMIT=$(git rev-parse main)
          LAST_COMMIT=$(cat ../lobe-msm-build/lobe-chat-main | tr -d '\n')
          if [ "$FETCHED_COMMIT" != "$LAST_COMMIT" ]; then
            echo "new_commit=true" >> $GITHUB_OUTPUT
            echo "fetched_commit=$FETCHED_COMMIT" >> $GITHUB_OUTPUT
            echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT

            echo "Fetched Commit: $FETCHED_COMMIT"
          else
            echo "new_commit=false" >> $GITHUB_OUTPUT
          fi

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.new_commit == 'true'
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Clone and check out `lobehub/lobe-chat`
        run: |
          set -euo pipefail
          cd ../
          git clone https://github.com/lobehub/lobe-chat.git -b main --depth 500
          cd ./lobe-chat
      - name: Collect release notes from main
        working-directory: ../lobe-chat
        env:
          FETCHED_COMMIT: ${{ needs.check.outputs.fetched_commit }}
          LAST_COMMIT: ${{ needs.check.outputs.last_commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! [[ "$FETCHED_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Invalid fetched_commit: '$FETCHED_COMMIT'" >&2
            exit 1
          fi
          if ! [[ "$LAST_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Invalid last_commit: '$LAST_COMMIT'" >&2
            exit 1
          fi

          write_summary() {
            {
              echo "## Release Notes"
              echo
              printf '%s\n' "$1"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # The initial clone is only 500 commits deep. Walk back until last_commit
          # is present so a multi-week gap still yields notes.
          depth=500
          while ! git cat-file -e "${LAST_COMMIT}^{commit}" 2>/dev/null; do
            if [ "$depth" -ge 10000 ]; then
              echo "last_commit $LAST_COMMIT was not found within $depth commits of main."
              write_summary "Skipped release notes: \`$LAST_COMMIT\` was not found within $depth commits of \`main\`."
              exit 0
            fi
            echo "Deepening clone by 2000 commits (current depth $depth) to find $LAST_COMMIT"
            git fetch --deepen=2000 origin main
            depth=$((depth + 2000))
          done

          if ! git cat-file -e "${FETCHED_COMMIT}^{commit}" 2>/dev/null; then
            echo "fetched_commit $FETCHED_COMMIT is not in this clone."
            write_summary "Skipped release notes: \`$FETCHED_COMMIT\` is not in the \`main\` clone."
            exit 0
          fi

          if ! git merge-base --is-ancestor "$LAST_COMMIT" "$FETCHED_COMMIT"; then
            echo "$LAST_COMMIT is not an ancestor of $FETCHED_COMMIT."
            write_summary "Skipped release notes: \`$LAST_COMMIT\` is not an ancestor of \`$FETCHED_COMMIT\`."
            exit 0
          fi

          echo "Collecting release merges on main between $LAST_COMMIT and $FETCHED_COMMIT"
          git log --reverse --first-parent --merges \
            --format='%x1e%H%x1f%s%x1f%b' \
            "$LAST_COMMIT..$FETCHED_COMMIT" > /tmp/release-commits.txt

          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const lastCommit = process.env.LAST_COMMIT;
          const fetchedCommit = process.env.FETCHED_COMMIT;
          const raw = fs.readFileSync('/tmp/release-commits.txt', 'utf8');
          const releases = [];

          for (const record of raw.split('\x1e')) {
            const trimmed = record.trim();
            if (!trimmed) continue;
            const first = trimmed.indexOf('\x1f');
            const second = trimmed.indexOf('\x1f', first + 1);
            if (first < 0 || second < 0) continue;
            const subject = trimmed.slice(first + 1, second);
            const body = trimmed.slice(second + 1).trim();
            if (!/^🚀 release\b/u.test(subject)) continue;
            releases.push({ subject, body });
          }

          async function fetchPullRequestBody(prNumber) {
            const url = `https://api.github.com/repos/lobehub/lobe-chat/pulls/${prNumber}`;
            const headers = {
              Accept: 'application/vnd.github+json',
              'User-Agent': 'lobe-msm-build-release-notes',
              'X-GitHub-Api-Version': '2026-03-10',
            };
            const token = process.env.GITHUB_TOKEN;
            if (token) headers.Authorization = `Bearer ${token}`;

            let response = await fetch(url, { headers });
            if (!response.ok && headers.Authorization) {
              delete headers.Authorization;
              response = await fetch(url, { headers });
            }
            if (!response.ok) {
              throw new Error(`Pull request #${prNumber} returned HTTP ${response.status}`);
            }
            const data = await response.json();
            return typeof data.body === 'string' ? data.body.trim() : '';
          }

          const lines = ['## Release Notes', ''];
          if (releases.length === 0) {
            lines.push(
              `No release commits on main between \`${lastCommit}\` and \`${fetchedCommit}\`.`,
            );
          } else {
            for (const release of releases) {
              let note = release.body;
              if (!note) {
                const pr = release.subject.match(/\(#(\d+)\)/);
                if (pr) {
                  try {
                    note = await fetchPullRequestBody(pr[1]);
                  } catch (error) {
                    console.error(error);
                    note = '';
                  }
                }
                if (!note) {
                  note = '_No release note in the commit message._';
                }
              }
              lines.push(`### ${release.subject}`, '', note, '');
            }
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          console.log(`Wrote ${releases.length} release note(s) to the job summary.`);
          EOF

  build-image:
    name: Build
    needs: check
    if: needs.check.outputs.new_commit == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read # Called workflow needs to read/checkout sources.
      packages: write # Called workflow needs to push images to GHCR.
    secrets:
      DEPLOY_API_ENDPOINT: ${{ secrets.DEPLOY_API_ENDPOINT }}
      DEPLOY_AUTH_KEY: ${{ secrets.DEPLOY_AUTH_KEY }}
    with:
      update_run_id: ${{ github.run_id }}
      new_lobechat_main_commit: ${{ needs.check.outputs.fetched_commit }}

  update-commit-hash:
    name: Update commit hash file
    runs-on: ubuntu-latest
    needs: [check, build-image]
    permissions:
      contents: write # Required to update lobe-chat-main in-repo.

    steps:
      - name: Update lobe-chat-main via GitHub Contents API
        shell: bash
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          FETCHED_COMMIT: ${{ needs.check.outputs.fetched_commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! [[ "$FETCHED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid fetched_commit: '$FETCHED_COMMIT'" >&2
            exit 1
          fi

          FILE_PATH="lobe-chat-main"
          API_BASE="https://api.github.com"
          AUTH_HEADER="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github+json"

          # 1) Get current file SHA (needed for update; omitted for create).
          GET_URL="$API_BASE/repos/$REPO/contents/$FILE_PATH?ref=$BRANCH"
          HTTP_STATUS="$(curl -sS -o current.json -w '%{http_code}' -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$GET_URL")"
          FILE_SHA=""
          if [ "$HTTP_STATUS" = "200" ]; then
            FILE_SHA="$(jq -r .sha < current.json)"
          elif [ "$HTTP_STATUS" = "404" ]; then
            FILE_SHA=""
          else
            cat current.json >&2
            echo "Failed to fetch $FILE_PATH metadata (HTTP $HTTP_STATUS)" >&2
            exit 1
          fi

          CONTENT_B64="$(printf '%s\n' "$FETCHED_COMMIT" | base64 -w0)"

          PAYLOAD="$(jq -n \
            --arg message "Update lobe-chat-main to: $FETCHED_COMMIT" \
            --arg content "$CONTENT_B64" \
            --arg branch "$BRANCH" \
            --arg sha "$FILE_SHA" \
            '{
                message: $message,
                content: $content,
                branch: $branch
              } + (if ($sha | length) > 0 then { sha: $sha } else {} end)'
          )"

          PUT_URL="$API_BASE/repos/$REPO/contents/$FILE_PATH"
          HTTP_STATUS="$(curl -sS -o response.json -w '%{http_code}' \
            -X PUT \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$PUT_URL")"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            cat response.json >&2
            echo "Failed to update $FILE_PATH (HTTP $HTTP_STATUS)" >&2
            exit 1
          fi
