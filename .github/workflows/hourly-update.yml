name: Hourly Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: read # Default: read-only; jobs that must write will override at job-level.

env:
  GIT_AUTHOR_NAME: actions-user
  GIT_AUTHOR_EMAIL: action@github.com
  GIT_COMMITTER_NAME: actions-user
  GIT_COMMITTER_EMAIL: action@github.com

concurrency:
  group: ${{ github.workflow }}

jobs:
  check:
    name: Check for updates in Lobe Chat
    runs-on: ubuntu-latest
    outputs:
      new_commit: ${{ steps.check-updates.outputs.new_commit }}
      fetched_commit: ${{ steps.check-updates.outputs.fetched_commit }}
      last_commit: ${{ steps.check-updates.outputs.last_commit }}

    steps:
      - name: Check out patch repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Clone and check out `lobehub/lobe-chat`
        run: |
          set -euo pipefail
          cd ../
          git clone https://github.com/lobehub/lobe-chat.git -b main --depth 5
          cd ./lobe-chat
      - name: Check latest (main branch) commit hash of Lobe Chat
        id: check-updates
        working-directory: ../lobe-chat
        run: |
          set -euo pipefail
          FETCHED_COMMIT=$(git rev-parse main)
          LAST_COMMIT=$(cat ../lobe-msm-build/lobe-chat-main | tr -d '\n')
          if [ "$FETCHED_COMMIT" != "$LAST_COMMIT" ]; then
            echo "new_commit=true" >> $GITHUB_OUTPUT
            echo "fetched_commit=$FETCHED_COMMIT" >> $GITHUB_OUTPUT
            echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT

            echo "Fetched Commit: $FETCHED_COMMIT"
          else
            echo "new_commit=false" >> $GITHUB_OUTPUT
          fi

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.new_commit == 'true'
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Clone and check out `lobehub/lobe-chat`
        run: |
          set -euo pipefail
          cd ../
          git clone https://github.com/lobehub/lobe-chat.git -b main --depth 500
          cd ./lobe-chat
      - name: Find relevant commits and tags
        id: tags
        working-directory: ../lobe-chat
        env:
          FETCHED_COMMIT: ${{ needs.check.outputs.fetched_commit }}
          LAST_COMMIT: ${{ needs.check.outputs.last_commit }}
        run: |
          set -euo pipefail

          if ! [[ "$FETCHED_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Invalid fetched_commit: '$FETCHED_COMMIT'" >&2
            exit 1
          fi
          if ! [[ "$LAST_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Invalid last_commit: '$LAST_COMMIT'" >&2
            exit 1
          fi

          echo "Fetching releases between $LAST_COMMIT and $FETCHED_COMMIT"
          if ! git cat-file -t "$LAST_COMMIT" &>/dev/null; then
            echo "$LAST_COMMIT is not a valid commit. Skipping release notes fetch."
            exit 0
          fi

          COMMITS=$(git log --pretty=format:"%H" "$LAST_COMMIT..$FETCHED_COMMIT" | tr '\n' ' ')
          echo "Commits between: $COMMITS"

          FUTURE_COMMIT=$(git log --pretty=format:"%H" $FETCHED_COMMIT..main --reverse | head -1)
          if [ -n "$FUTURE_COMMIT" ]; then
            TAGS=$(git tag --contains "$LAST_COMMIT" --no-contains "$FUTURE_COMMIT")
          else
            TAGS=$(git tag --contains "$LAST_COMMIT")
          fi

          if [ -z "$TAGS" ]; then
            echo "No tags found between specified commits."
            exit 0
          fi

          TAGS=$(echo "$TAGS" | tr '\n' ' ')

          echo "Tags between the specified commits: $TAGS"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "TAGS=$TAGS" >> $GITHUB_ENV
      - name: Fetch release notes
        if: steps.tags.outputs.tags != ''
        run: |
          set -euo pipefail
          curl -sSf "https://api.github.com/repositories/643445235/releases" > releases.json
          node -e "
            const fs = require('fs');
            const releases = JSON.parse(fs.readFileSync('releases.json', 'utf-8'));
            const tags = process.env.TAGS.split(/\s+/);

            const releaseNotes = releases
              .filter(release => tags.includes(release.tag_name))
              .map(
                release => release.body.replaceAll(
                  '<div align=\"right\">\n\n[![](https://img.shields.io/badge/-BACK_TO_TOP-151515?style=flat-square)](#readme-top)\n\n</div>',
                  ''
                )
              ).reverse().join('\\n').replaceAll('\\n\\n', '\\n');

            const output = [
              '## Release Notes',
              releaseNotes || 'No new releases found between specified commits.'
            ].join('\\n');

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, output);
          "

  build-image:
    name: Build
    needs: check
    if: needs.check.outputs.new_commit == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read # Called workflow needs to read/checkout sources.
      packages: write # Called workflow needs to push images to GHCR.
    secrets:
      DEPLOY_API_ENDPOINT: ${{ secrets.DEPLOY_API_ENDPOINT }}
      DEPLOY_AUTH_KEY: ${{ secrets.DEPLOY_AUTH_KEY }}
    with:
      update_run_id: ${{ github.run_id }}
      new_lobechat_main_commit: ${{ needs.check.outputs.fetched_commit }}

  update-commit-hash:
    name: Update commit hash file
    runs-on: ubuntu-latest
    needs: [check, build-image]
    permissions:
      contents: write # Required to update lobe-chat-main in-repo.

    steps:
      - name: Update lobe-chat-main via GitHub Contents API
        shell: bash
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          FETCHED_COMMIT: ${{ needs.check.outputs.fetched_commit }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! [[ "$FETCHED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid fetched_commit: '$FETCHED_COMMIT'" >&2
            exit 1
          fi

          FILE_PATH="lobe-chat-main"
          API_BASE="https://api.github.com"
          AUTH_HEADER="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github+json"

          # 1) Get current file SHA (needed for update; omitted for create).
          GET_URL="$API_BASE/repos/$REPO/contents/$FILE_PATH?ref=$BRANCH"
          HTTP_STATUS="$(curl -sS -o current.json -w '%{http_code}' -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" "$GET_URL")"
          FILE_SHA=""
          if [ "$HTTP_STATUS" = "200" ]; then
            FILE_SHA="$(jq -r .sha < current.json)"
          elif [ "$HTTP_STATUS" = "404" ]; then
            FILE_SHA=""
          else
            cat current.json >&2
            echo "Failed to fetch $FILE_PATH metadata (HTTP $HTTP_STATUS)" >&2
            exit 1
          fi

          CONTENT_B64="$(printf '%s\n' "$FETCHED_COMMIT" | base64 -w0)"

          PAYLOAD="$(jq -n \
            --arg message "Update lobe-chat-main to: $FETCHED_COMMIT" \
            --arg content "$CONTENT_B64" \
            --arg branch "$BRANCH" \
            --arg sha "$FILE_SHA" \
            '{
                message: $message,
                content: $content,
                branch: $branch
              } + (if ($sha | length) > 0 then { sha: $sha } else {} end)'
          )"

          PUT_URL="$API_BASE/repos/$REPO/contents/$FILE_PATH"
          HTTP_STATUS="$(curl -sS -o response.json -w '%{http_code}' \
            -X PUT \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$PUT_URL")"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            cat response.json >&2
            echo "Failed to update $FILE_PATH (HTTP $HTTP_STATUS)" >&2
            exit 1
          fi
