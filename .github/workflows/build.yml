name: Build lobechat-msm

on:
  workflow_call:
  workflow_dispatch:
  # push:
  #   branches:
  #     - default

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GIT_AUTHOR_NAME: actions-user
  GIT_AUTHOR_EMAIL: action@github.com
  GIT_COMMITTER_NAME: actions-user
  GIT_COMMITTER_EMAIL: action@github.com

jobs:
  build-lobe-ui:
    name: Build Lobe UI
    runs-on: ubuntu-latest

    steps:
      - name: Check out patch repo
        uses: actions/checkout@v4
      - name: Clone and check out `lobehub/lobe-ui`
        run: |
          cd ../
          git clone https://github.com/lobehub/lobe-ui.git --depth 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build Lobe UI with patches
        working-directory: ../lobe-ui
        run: |
          git am ../lobe-msm-build/lobe-ui.patch
          bun install && bun run build
      - name: Pack Lobe UI package
        working-directory: ../lobe-ui
        run: |
          npm pack
          mv lobehub-ui-*.tgz lobehub-ui.tgz
      - name: Workaround actions/upload-artifact#176
        run: |
          echo "artifacts_path=$(realpath ../lobe-ui/lobehub-ui.tgz)" >> $GITHUB_ENV
      - name: Upload tarball of patched Lobe UI package
        uses: actions/upload-artifact@v4
        with:
          name: lobe-ui-tarball
          path: ${{ env.artifacts_path }}
          if-no-files-found: "error"
          retention-days: 7
          compression-level: 0

  build-lobe-chat:
    name: Build Lobe Chat and upload Docker image
    runs-on: ubuntu-latest
    needs: build-lobe-ui

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out patch repo
        uses: actions/checkout@v4
      - name: Retrieve HEAD hash of `lobehub/lobe-chat`
        run: echo "LOBECHAT_HEAD=$(cat lobe-chat-HEAD | tr -d '\n')" >> $GITHUB_ENV
      - name: Clone and check out `lobehub/lobe-chat`
        run: |
          cd ../
          git clone https://github.com/lobehub/lobe-chat.git --depth 50
          cd ./lobe-chat
          git checkout --detach ${{ env.LOBECHAT_HEAD }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ../lobe-chat/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download Lobe UI tarball
        uses: actions/download-artifact@v4
        with:
          name: lobe-ui-tarball
          path: ../lobe-chat/
      - name: Prepare Lobe Chat build environment
        working-directory: ../lobe-chat
        run: |
          sed -i "s|COPY package.json ./|COPY package.json lobehub-ui.tgz ./|" Dockerfile.database
          pnpm install ./lobehub-ui.tgz
          echo ".pnpm-store" >> .dockerignore
          git am ../lobe-msm-build/lobe-chat.patch
      - name: Build Lobe Chat Docker image
        working-directory: ../lobe-chat
        run: |
          docker build -t $REGISTRY/${IMAGE_NAME,,}:latest -t $REGISTRY/${IMAGE_NAME,,}:$(echo $GITHUB_SHA | head -c7) \
             . -f Dockerfile.database
      - name: Push Docker image
        run: |
          docker push $REGISTRY/${IMAGE_NAME,,}:latest
          docker push $REGISTRY/${IMAGE_NAME,,}:$(echo $GITHUB_SHA | head -c7)
