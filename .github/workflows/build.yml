name: Build lobechat-msm

on:
  workflow_call:
    inputs:
      update_run_id:
        type: string
        default: "-1"
      new_lobechat_main_commit:
        type: string
        required: true
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GIT_AUTHOR_NAME: actions-user
  GIT_AUTHOR_EMAIL: action@github.com
  GIT_COMMITTER_NAME: actions-user
  GIT_COMMITTER_EMAIL: action@github.com

jobs:
  build-lobe-ui:
    name: Build Lobe UI
    runs-on: ubuntu-latest

    steps:
      - name: Check out patch repo
        uses: actions/checkout@v4
      - name: Clone and check out `lobehub/lobe-ui`
        run: |
          cd ../
          mkdir lobe-ui
          cd lobe-ui
          git init
          git remote add upstream https://github.com/lobehub/lobe-ui.git
          git fetch --depth 1 upstream 959bf458f4746cf6c060a1260058bcd47f422cb9 # v2.24.3
          git checkout --detach 959bf458f4746cf6c060a1260058bcd47f422cb9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build Lobe UI with patches
        working-directory: ../lobe-ui
        run: |
          git am ../lobe-msm-build/lobe-ui.patch
          bun install && bun run build
      - name: Pack Lobe UI package
        working-directory: ../lobe-ui
        run: |
          npm pack
          mv lobehub-ui-*.tgz lobehub-ui.tgz
      - name: Workaround actions/upload-artifact#176
        run: |
          echo "artifacts_path=$(realpath ../lobe-ui/lobehub-ui.tgz)" >> $GITHUB_ENV
      - name: Upload tarball of patched Lobe UI package
        uses: actions/upload-artifact@v4
        with:
          name: lobe-ui-tarball
          path: ${{ env.artifacts_path }}
          if-no-files-found: "error"
          retention-days: 7
          compression-level: 0

  build-lobe-chat:
    name: Build Lobe Chat and upload Docker image
    runs-on: ubuntu-latest
    needs: build-lobe-ui

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out patch repo
        uses: actions/checkout@v4
      - name: Retrieve `lobehub/lobe-chat` latest main branch commit hash from workflow inputs
        if: inputs.new_lobechat_main_commit
        run: echo "LOBECHAT_LATEST_MAIN=${{ inputs.new_lobechat_main_commit }}" >> $GITHUB_ENV
      - name: Retrieve `lobehub/lobe-chat` latest main branch commit hash from patch repo
        if: ${{ ! inputs.new_lobechat_main_commit }}
        run: echo "LOBECHAT_LATEST_MAIN=$(cat lobe-chat-main | tr -d '\n')" >> $GITHUB_ENV
      - name: Clone and check out `lobehub/lobe-chat`
        run: |
          cd ../
          mkdir lobe-chat
          cd lobe-chat
          git init
          git remote add upstream https://github.com/lobehub/lobe-chat.git
          git fetch --depth 1 upstream ${{ env.LOBECHAT_LATEST_MAIN }}
          git checkout --detach ${{ env.LOBECHAT_LATEST_MAIN }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ../lobe-chat/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download Lobe UI tarball
        uses: actions/download-artifact@v4
        with:
          name: lobe-ui-tarball
          path: ../lobe-chat/
      - name: Prepare Lobe Chat build environment
        working-directory: ../lobe-chat
        run: |
          sed -i "s|COPY package.json pnpm-workspace.yaml ./|COPY package.json pnpm-workspace.yaml lobehub-ui.tgz ./|" Dockerfile.database
          git am ../lobe-msm-build/lobe-chat.patch
          pnpm install ./lobehub-ui.tgz -w
          echo ".pnpm-store" >> .dockerignore
      - name: Build Lobe Chat Docker image
        working-directory: ../lobe-chat
        run: |
          docker build -t $REGISTRY/${IMAGE_NAME,,}:latest -t $REGISTRY/${IMAGE_NAME,,}:$(echo $GITHUB_SHA | head -c7) \
             . -f Dockerfile.database
      - name: Push Docker image
        run: |
          docker push $REGISTRY/${IMAGE_NAME,,}:latest
          docker push $REGISTRY/${IMAGE_NAME,,}:$(echo $GITHUB_SHA | head -c7)
      - name: Deploy
        env:
          DEPLOY_API_ENDPOINT: ${{ secrets.DEPLOY_API_ENDPOINT }}
          DEPLOY_AUTH_KEY: ${{ secrets.DEPLOY_AUTH_KEY }}
        run: |
          UPDATE_RUN_ID=${{ inputs.update_run_id }}
          if [ "$UPDATE_RUN_ID" -gt 0 ]; then
            curl -s -f -H "Authorization: $DEPLOY_AUTH_KEY" -H "Content-Type: application/json" -X POST $DEPLOY_API_ENDPOINT -d "{\"runId\":$UPDATE_RUN_ID}"
          else
            curl -s -f -H "Authorization: $DEPLOY_AUTH_KEY" -X POST $DEPLOY_API_ENDPOINT
          fi
