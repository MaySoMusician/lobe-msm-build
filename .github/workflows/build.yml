name: Build lobechat-msm

on:
  workflow_call:
    inputs:
      update_run_id:
        description: Optional caller workflow run_id (used by deploy hook).
        type: string
        default: "-1"
      new_lobechat_main_commit:
        description: Git SHA (7-40 hex chars) of lobehub/lobe-chat to build.
        type: string
        required: true
    secrets:
      DEPLOY_API_ENDPOINT:
        required: true
      DEPLOY_AUTH_KEY:
        required: true
  workflow_dispatch:
    inputs:
      update_run_id:
        description: Optional caller workflow run_id (used by deploy hook).
        type: string
        required: false
        default: "-1"
      new_lobechat_main_commit:
        description: Optional Git SHA of lobehub/lobe-chat to build. If empty, uses ./lobe-chat-main.
        type: string
        required: false

permissions:
  contents: read # Required for actions/checkout (default for all jobs unless overridden).

concurrency:
  # Prevent concurrent runs racing on pushing :latest and/or calling Deploy concurrently.
  group: lobechat-msm-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AUDITED_NPM_REGISTRY: https://npm.flatt.tech/
  GIT_AUTHOR_NAME: actions-user
  GIT_AUTHOR_EMAIL: action@github.com
  GIT_COMMITTER_NAME: actions-user
  GIT_COMMITTER_EMAIL: action@github.com

jobs:
  build-lobe-ui:
    name: Build Lobe UI
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout patch repo only; no writes needed.

    steps:
      - name: Check out patch repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Clone and check out `lobehub/lobe-ui`
        run: |
          set -euo pipefail
          cd ../
          git clone https://github.com/lobehub/lobe-ui.git --depth 50
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Apply Lobe UI patch
        working-directory: ../lobe-ui
        run: |
          set -euo pipefail
          git am ../lobe-msm-build/lobe-ui.patch
      - name: Build and pack Lobe UI package
        run: |
          set -euo pipefail
          LOBE_UI_DIR="$(realpath ../lobe-ui)" node scripts/prepare-lobe-ui-msm.mjs
      - name: Workaround actions/upload-artifact#176
        run: |
          set -euo pipefail
          echo "artifacts_path=$(realpath .artifacts/lobehub-ui.tgz)" >> "$GITHUB_ENV"
      - name: Upload tarball of patched Lobe UI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lobe-ui-tarball
          path: ${{ env.artifacts_path }}
          if-no-files-found: "error"
          retention-days: 7
          compression-level: 0

  verify-trust-policy-exceptions:
    name: Verify trust-policy exceptions
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - name: Check out patch repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.21.0
      - name: Verify trust-policy exceptions against canonical registry
        env:
          NPM_CANONICAL_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          node scripts/verify-lobe-chat-trust-policy-exceptions.mjs

  test-patched-lobe-chat:
    name: Test patched Lobe Chat
    runs-on: ubuntu-latest
    needs:
      - build-lobe-ui
      - verify-trust-policy-exceptions
    permissions:
      contents: read # Required for actions/checkout (patch repo).

    steps:
      - name: Check out patch repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Determine `lobehub/lobe-chat` commit to build
        id: lobechat-commit
        shell: bash
        env:
          INPUT_COMMIT: ${{ inputs.new_lobechat_main_commit }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_COMMIT:-}" ]]; then
            COMMIT="$INPUT_COMMIT"
          else
            COMMIT="$(tr -d '\n' < lobe-chat-main)"
          fi

          # Strict validation prevents any newline/whitespace/shell-metachar injection.
          if ! [[ "$COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Invalid lobehub/lobe-chat commit SHA: '$COMMIT'" >&2
            exit 1
          fi

          printf 'commit=%s\n' "$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Clone and check out `lobehub/lobe-chat`
        env:
          LOBECHAT_LATEST_MAIN: ${{ steps.lobechat-commit.outputs.commit }}
        run: |
          set -euo pipefail
          cd ../
          mkdir lobe-chat
          cd lobe-chat
          git init
          git remote add upstream https://github.com/lobehub/lobe-chat.git
          git fetch --depth 1 upstream "$LOBECHAT_LATEST_MAIN"
          git checkout --detach "$LOBECHAT_LATEST_MAIN"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: ../lobe-chat/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Download Lobe UI tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lobe-ui-tarball
          path: ../lobe-chat/
      - name: Apply lobe-chat patch and wire patched @lobehub/ui
        working-directory: ../lobe-chat
        run: |
          set -euo pipefail
          git am ../lobe-msm-build/lobe-chat.patch
          export UI_TGZ="$(realpath lobehub-ui.tgz)"
          test -f "$UI_TGZ"
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const specifier = `file:${process.env.UI_TGZ}`;
          packageJson.dependencies['@lobehub/ui'] = specifier;
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);

          const workspacePath = 'pnpm-workspace.yaml';
          let workspace = fs.readFileSync(workspacePath, 'utf8');
          const entry = `  '@lobehub/ui': ${JSON.stringify(specifier)}`;
          const existing = /^  '@lobehub\/ui':.*$/m;
          workspace = existing.test(workspace)
            ? workspace.replace(existing, entry)
            : workspace.replace(/^overrides:\s*$/m, `overrides:\n${entry}`);
          if (!workspace.includes(entry)) throw new Error('Failed to set pnpm workspace UI override');
          fs.writeFileSync(workspacePath, workspace);
          NODE
          grep -F "\"@lobehub/ui\": \"file:${UI_TGZ}\"" package.json
          grep -F "'@lobehub/ui': \"file:${UI_TGZ}\"" pnpm-workspace.yaml
      - name: Install lobe-chat dependencies
        working-directory: ../lobe-chat
        run: |
          set -euo pipefail
          npm config set --location=project registry "$AUDITED_NPM_REGISTRY"
          test "$(npm config get registry | sed 's#/*$#/#')" = "$AUDITED_NPM_REGISTRY"
          pnpm config --global set --json fetchRetries 5
          pnpm config --global set --json fetchRetryMintimeout 30000
          pnpm config --global set --json networkConcurrency 8
          pnpm install
      - name: Apply msm test overlay and run checks
        run: |
          set -euo pipefail
          export LOBE_CHAT_DIR="$(cd ../lobe-chat && pwd)"
          ./scripts/apply-lobe-chat-msm-tests.sh
          node scripts/verify-lobe-chat-patch-invariants.mjs
          node scripts/run-lobe-chat-msm-tests.mjs

  build-lobe-chat:
    name: Build Lobe Chat Docker image
    runs-on: ubuntu-latest
    needs:
      - build-lobe-ui
      - verify-trust-policy-exceptions

    permissions:
      contents: read # Required for actions/checkout (patch repo).

    steps:
      - name: Check out patch repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Determine `lobehub/lobe-chat` commit to build
        id: lobechat-commit
        shell: bash
        env:
          INPUT_COMMIT: ${{ inputs.new_lobechat_main_commit }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_COMMIT:-}" ]]; then
            COMMIT="$INPUT_COMMIT"
          else
            COMMIT="$(tr -d '\n' < lobe-chat-main)"
          fi

          # Strict validation prevents any newline/whitespace/shell-metachar injection.
          if ! [[ "$COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Invalid lobehub/lobe-chat commit SHA: '$COMMIT'" >&2
            exit 1
          fi

          printf 'commit=%s\n' "$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Clone and check out `lobehub/lobe-chat`
        env:
          LOBECHAT_LATEST_MAIN: ${{ steps.lobechat-commit.outputs.commit }}
        run: |
          set -euo pipefail
          cd ../
          mkdir lobe-chat
          cd lobe-chat
          git init
          git remote add upstream https://github.com/lobehub/lobe-chat.git
          git fetch --depth 1 upstream "$LOBECHAT_LATEST_MAIN"
          git checkout --detach "$LOBECHAT_LATEST_MAIN"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: ../lobe-chat/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.21.0
      - name: Download Lobe UI tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lobe-ui-tarball
          path: ../lobe-chat/
      - name: Prepare Lobe Chat build environment
        working-directory: ../lobe-chat
        run: |
          set -euo pipefail
          git am ../lobe-msm-build/lobe-chat.patch
          grep -F "COPY package.json pnpm-workspace.yaml ./" Dockerfile
          sed -i "s|COPY package.json pnpm-workspace.yaml ./|COPY package.json pnpm-workspace.yaml lobehub-ui.tgz ./|" Dockerfile
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const specifier = 'file:/app/lobehub-ui.tgz';
          packageJson.dependencies['@lobehub/ui'] = specifier;
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);

          const workspacePath = 'pnpm-workspace.yaml';
          let workspace = fs.readFileSync(workspacePath, 'utf8');
          const entry = `  '@lobehub/ui': ${JSON.stringify(specifier)}`;
          const existing = /^  '@lobehub\/ui':.*$/m;
          workspace = existing.test(workspace)
            ? workspace.replace(existing, entry)
            : workspace.replace(/^overrides:\s*$/m, `overrides:\n${entry}`);
          if (!workspace.includes(entry)) throw new Error('Failed to set pnpm workspace UI override');
          fs.writeFileSync(workspacePath, workspace);
          NODE
          grep -F "COPY package.json pnpm-workspace.yaml lobehub-ui.tgz ./" Dockerfile
          grep -F "'@lobehub/ui': \"file:/app/lobehub-ui.tgz\"" pnpm-workspace.yaml
      - name: Build Lobe Chat Docker image
        working-directory: ../lobe-chat
        run: |
          set -euo pipefail
          docker build \
            --build-arg NPM_REGISTRY="$AUDITED_NPM_REGISTRY" \
            -t $REGISTRY/${IMAGE_NAME,,}:latest \
            -t $REGISTRY/${IMAGE_NAME,,}:$(echo $GITHUB_SHA | head -c7) \
            . -f Dockerfile
      - name: Save Docker image artifact
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "$GITHUB_SHA" | head -c7)"
          IMAGE_BASE="$REGISTRY/${IMAGE_NAME,,}"
          docker save "${IMAGE_BASE}:latest" "${IMAGE_BASE}:${SHORT_SHA}" | gzip > lobe-chat-image.tar.gz
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lobe-chat-image
          path: lobe-chat-image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-lobe-chat-behavior:
    name: Test assembled Lobe Chat behavior
    runs-on: ubuntu-latest
    needs:
      - build-lobe-chat
      - test-patched-lobe-chat
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Check out patch repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.21.0
      - name: Download assembled Lobe Chat image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lobe-chat-image
          path: .
      - name: Load assembled Lobe Chat image
        run: gunzip -c lobe-chat-image.tar.gz | docker load
      - name: Install standalone test dependencies
        working-directory: lobe-chat-tests/playwright
        run: |
          set -euo pipefail
          npm config set --location=project registry "$AUDITED_NPM_REGISTRY"
          test "$(npm config get registry | sed 's#/*$#/#')" = "$AUDITED_NPM_REGISTRY"
          pnpm config --global set --json fetchRetries 5
          pnpm config --global set --json fetchRetryMintimeout 30000
          pnpm config --global set --json networkConcurrency 8
          pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        working-directory: lobe-chat-tests/playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Start assembled Lobe Chat image
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          set -euo pipefail
          APP_IMAGE="${APP_IMAGE,,}"
          docker run -d \
            --name lobe-chat-msm-behavior \
            --network host \
            -e APP_URL=http://localhost:3210 \
            -e AUTH_EMAIL_VERIFICATION=0 \
            -e AUTH_SECRET=e2e-test-secret-key-for-better-auth-32chars! \
            -e DATABASE_DRIVER=node \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            -e KEY_VAULTS_SECRET=LA7n9k3JdEcbSgml2sxfw+4TV1AzaaFU5+R176aQz4s= \
            -e OPENAI_API_KEY=msm-test-key \
            -e OPENAI_PROXY_URL=http://127.0.0.1:4010/v1 \
            -e PORT=3210 \
            -e S3_ACCESS_KEY_ID=e2e-mock-access-key \
            -e S3_BUCKET=e2e-mock-bucket \
            -e S3_ENDPOINT=https://e2e-mock-s3.invalid \
            -e S3_SECRET_ACCESS_KEY=e2e-mock-secret-key \
            "$APP_IMAGE"

          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 2 http://localhost:3210/ >/dev/null; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' lobe-chat-msm-behavior | grep -q true; then
              docker logs lobe-chat-msm-behavior
              exit 1
            fi
            sleep 1
          done

          docker logs lobe-chat-msm-behavior
          exit 1
      - name: Run standalone behavior tests
        working-directory: lobe-chat-tests/playwright
        env:
          BASE_URL: http://localhost:3210
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          MSM_PROVIDER_INTEGRATION: "1"
        run: pnpm test
      - name: Capture application logs
        if: always()
        run: docker logs lobe-chat-msm-behavior > lobe-chat-behavior-app.log 2>&1 || true
      - name: Upload behavior-test failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lobe-chat-behavior-failure
          path: |
            lobe-chat-behavior-app.log
            lobe-chat-tests/playwright/playwright-report
            lobe-chat-tests/playwright/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop behavior-test application
        if: always()
        run: docker rm -f lobe-chat-msm-behavior || true

  push-and-deploy:
    name: Push image and deploy
    runs-on: ubuntu-latest
    needs:
      - test-patched-lobe-chat
      - build-lobe-chat
      - test-lobe-chat-behavior
    permissions:
      contents: read
      packages: write # Required to push images to GHCR.

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lobe-chat-image
          path: .
      - name: Load Docker image
        run: |
          set -euo pipefail
          gunzip -c lobe-chat-image.tar.gz | docker load
      - name: Push Docker image
        run: |
          set -euo pipefail
          docker push $REGISTRY/${IMAGE_NAME,,}:latest
          docker push $REGISTRY/${IMAGE_NAME,,}:$(echo $GITHUB_SHA | head -c7)
      - name: Deploy
        env:
          DEPLOY_API_ENDPOINT: ${{ secrets.DEPLOY_API_ENDPOINT }}
          DEPLOY_AUTH_KEY: ${{ secrets.DEPLOY_AUTH_KEY }}
          UPDATE_RUN_ID: ${{ inputs.update_run_id }}
        run: |
          set -euo pipefail

          if ! [[ "${UPDATE_RUN_ID:-}" =~ ^-?[0-9]+$ ]]; then
            echo "Invalid update_run_id: '${UPDATE_RUN_ID:-}'" >&2
            exit 1
          fi

          if [ "$UPDATE_RUN_ID" -gt 0 ]; then
            curl -sSf \
              -H "Authorization: $DEPLOY_AUTH_KEY" \
              -H "Content-Type: application/json" \
              -X POST "$DEPLOY_API_ENDPOINT" \
              -d "{\"runId\":$UPDATE_RUN_ID}"
          else
            curl -sSf \
              -H "Authorization: $DEPLOY_AUTH_KEY" \
              -X POST "$DEPLOY_API_ENDPOINT"
           fi
